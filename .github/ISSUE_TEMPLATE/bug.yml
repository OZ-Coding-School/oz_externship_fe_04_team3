name: "🐞 Bug Report"
description: "버그 또는 오류를 제보하는 템플릿"
title: "[fix] 버그 요약"

body:
  - type: textarea
    id: description
    attributes:
      label: 어떤 문제가 발생했나요?
      description: "발생한 버그를 간단하게 설명해주세요."
      placeholder: |
        예)
        로그인 버튼 클릭 시 반응이 없습니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 단계 (Steps to Reproduce)
      description: "어떤 과정을 통해 이 버그가 발생했는지 단계별로 적어주세요."
      placeholder: |
        1. 로그인 페이지로 이동
        2. 이메일 입력
        3. 로그인 버튼 클릭
        4. 반응 없음
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대했던 동작
      description: "정상적으로라면 어떤 동작이 발생해야 하나요?"
      placeholder: "로그인 성공 후 홈 화면으로 이동해야 합니다."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 스크린샷 / 로그 (선택)
      description: "버그 상황을 보여주는 이미지나 콘솔 로그가 있다면 첨부해주세요."
      placeholder: |
        - 오류 화면 캡처
        - 콘솔 에러 로그

  - type: dropdown
    id: severity
    attributes:
      label: 버그 심각도
      description: "해당 버그의 영향도를 선택해주세요."
      options:
        - 낮음 (Low) – 기능은 동작하나 문제가 있음
        - 중간 (Medium) – 특정 상황에서 기능이 정상 동작하지 않음
        - 높음 (High) – 기능이 거의 사용 불가
        - 치명적 (Critical) – 서비스 전체를 막는 심각한 수준
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 비고 (선택)
      placeholder: "추가로 공유할 내용이 있다면 입력해주세요."
