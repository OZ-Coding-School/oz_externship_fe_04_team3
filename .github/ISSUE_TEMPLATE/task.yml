name: "📌 Task"
description: "간단한 작업용 이슈 템플릿"
title: "[Type] 한 줄 요약" # 예시: [feat] 로그인 UI 구현

body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: "작업 유형을 선택하세요"
      options:
        - feat
        - fix
        - chore
        - docs
        - build
        - test
        - refactor
        - hotfix
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 작업 설명
      description: "작업에 대한 간단한 설명을 작성하세요."
      placeholder: |
        예)
        로그인 페이지 UI 구현입니다.
        상태 관리 및 버튼 로직 추가 예정.
    validations:
      required: true

  - type: textarea
    id: todos
    attributes:
      label: Todos
      description: "해야 할 작업을 체크리스트로 나열하세요."
      placeholder: |
        - [ ] TODO 1
        - [ ] TODO 2
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료 (선택)
      description: "관련 문서, 시안, API 명세 등을 첨부하세요."
      placeholder: |
        - 디자인 링크
        - API 문서
